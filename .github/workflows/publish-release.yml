name: Publish encrypted app release

on:
  push:
    branches: [main]
    paths:
      - latest.apk.enc
      - update.json
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version_name="$(jq -r '.versionName' update.json)"
          version_code="$(jq -r '.versionCode' update.json)"
          echo "tag=v${version_name}-${version_code}" >> "$GITHUB_OUTPUT"
          echo "title=App ${version_name} (${version_code})" >> "$GITHUB_OUTPUT"
          jq -r '.notes' update.json > release-notes.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" \
            latest.apk.enc update.json --clobber
