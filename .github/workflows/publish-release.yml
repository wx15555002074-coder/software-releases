name: Publish encrypted app release

on:
  push:
    branches: [main]
    paths:
      - latest.apk.enc
      - pending-update.json
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version_name="$(jq -r '.versionName' pending-update.json)"
          version_code="$(jq -r '.versionCode' pending-update.json)"
          echo "tag=v${version_name}-${version_code}" >> "$GITHUB_OUTPUT"
          echo "title=App ${version_name} (${version_code})" >> "$GITHUB_OUTPUT"
          jq -r '.notes' pending-update.json > release-notes.txt

      - name: Verify staged artifact
        shell: bash
        run: |
          expected_hash="$(jq -r '.encryptedSha256' pending-update.json)"
          expected_bytes="$(jq -r '.encryptedBytes' pending-update.json)"
          actual_hash="$(sha256sum latest.apk.enc | cut -d ' ' -f 1)"
          actual_bytes="$(stat -c '%s' latest.apk.enc)"
          test "$actual_hash" = "$expected_hash"
          test "$actual_bytes" = "$expected_bytes"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.txt
          fi
          expected_digest="sha256:$(jq -r '.encryptedSha256' pending-update.json)"
          existing_digest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "latest.apk.enc") | .digest')"
          if [ -z "$existing_digest" ]; then
            gh release upload "$RELEASE_TAG" latest.apk.enc
          elif [ "$existing_digest" != "$expected_digest" ]; then
            echo "Release asset is immutable and has a different SHA-256" >&2
            exit 1
          fi

      - name: Verify anonymous release download
        shell: bash
        run: |
          asset_url="$(jq -r '.apkUrl' pending-update.json)"
          expected_hash="$(jq -r '.encryptedSha256' pending-update.json)"
          expected_bytes="$(jq -r '.encryptedBytes' pending-update.json)"
          curl --fail --location --silent --show-error --retry 3 \
            "$asset_url" --output downloaded.apk.enc
          actual_hash="$(sha256sum downloaded.apk.enc | cut -d ' ' -f 1)"
          actual_bytes="$(stat -c '%s' downloaded.apk.enc)"
          test "$actual_hash" = "$expected_hash"
          test "$actual_bytes" = "$expected_bytes"

      - name: Publish manifest after artifact verification
        shell: bash
        run: |
          cp pending-update.json update.json
          git add update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "发布更新清单 ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main

      - name: Purge and verify jsDelivr manifest
        shell: bash
        run: |
          manifest_url="https://cdn.jsdelivr.net/gh/wx15555002074-coder/software-releases@main/update.json"
          expected_hash="$(jq -r '.encryptedSha256' pending-update.json)"
          expected_url="$(jq -r '.apkUrl' pending-update.json)"
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/wx15555002074-coder/software-releases@main/update.json" \
            >/tmp/jsdelivr-purge.json
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$manifest_url" --output public-update.json; then
              public_hash="$(jq -r '.encryptedSha256' public-update.json)"
              public_url="$(jq -r '.apkUrl' public-update.json)"
              if [ "$public_hash" = "$expected_hash" ] && [ "$public_url" = "$expected_url" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "jsDelivr manifest did not refresh to the verified release" >&2
          exit 1
